{% extends 'stock/base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Menús</h1>
    <button type="button" class="btn btn-vino" data-bs-toggle="modal" data-bs-target="#nuevoMenuModal">+ Nuevo menú</button>
</div>
<div class="tabla-wrapper">
<table class="table">
    <thead><tr><th>Nombre</th><th>Descripción</th><th></th></tr></thead>
    <tbody>
        {% for menu in menus %}
        <tr>
            <td>{{ menu.nombre }}</td>
            <td>{{ menu.descripcion|truncatechars:60 }}</td>
            <td>
                <div class="acciones-fila">
                    <a href="{% url 'stock:menu_detail' menu.pk %}" class="btn-accion btn-ver">Ver</a>
                    <a href="{% url 'stock:menu_update' menu.pk %}" class="btn-accion btn-editar">Editar</a>
                    <a href="{% url 'stock:menu_delete' menu.pk %}" class="btn-accion btn-eliminar">Eliminar</a>
                </div>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="3">No hay menús cargados todavía.</td></tr>
        {% endfor %}
    </tbody>
</table>
</div>

<div class="modal fade" id="nuevoMenuModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Nuevo menú</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form method="post" action="{% url 'stock:menu_create' %}">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea name="descripcion" class="form-control" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-accion btn-volver" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-vino">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
