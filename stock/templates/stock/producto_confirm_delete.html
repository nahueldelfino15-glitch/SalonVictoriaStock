{% extends 'stock/base.html' %}
{% block content %}
<h1>Eliminar producto</h1>
<p>¿Seguro que querés eliminar <strong>{{ producto.nombre }}</strong>? Esta acción no se puede deshacer.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'stock:producto_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
