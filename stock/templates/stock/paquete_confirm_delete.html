{% extends 'stock/base.html' %}
{% block content %}
<h1>Eliminar paquete</h1>
<p>¿Seguro que querés eliminar <strong>{{ paquete.nombre }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn-accion btn-eliminar">Sí, eliminar</button>
    <a href="{% url 'stock:paquete_list' %}" class="btn-accion btn-volver">Cancelar</a>
</form>
{% endblock %}
