<div class="tabla-wrapper">
<table class="table align-middle">
    <thead>
        <tr><th>Producto</th><th class="text-end">Stock actual</th><th>Consumir</th></tr>
    </thead>
    <tbody>
        {% for producto in productos %}
        <tr>
            <td>{{ producto.nombre }}</td>
            <td class="text-end">{{ producto.stock_actual }} {{ producto.unidad_medida }}</td>
            <td>
                <form method="post" action="{% url 'stock:movimientostock_create' evento.pk %}" class="d-flex gap-2">
                    {% csrf_token %}
                    <input type="hidden" name="producto" value="{{ producto.pk }}">
                    <input type="hidden" name="tipo" value="salida">
                    <input type="hidden" name="next" value="{% url 'stock:consumo_evento' evento.pk %}#{{ tab_id }}">
                    <input type="number" name="cantidad" min="1" class="form-control form-control-sm" style="width:100px" placeholder="Cant." required>
                    <button type="submit" class="btn btn-sm btn-vino">+ Agregar</button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="3">No hay productos cargados en este sector.</td></tr>
        {% endfor %}
    </tbody>
</table>
</div>
