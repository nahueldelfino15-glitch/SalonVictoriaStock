{% extends 'stock/base.html' %}
{% block content %}
<h1>Consumo en "{{ evento.nombre }}"</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'stock:evento_detail' evento.pk %}" class="btn-accion btn-volver">Cancelar</a>
</form>
{% endblock %}
