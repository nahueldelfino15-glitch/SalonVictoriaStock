{% extends 'stock/base.html' %}
{% block content %}
<h1 class="mb-4">Consumo - Elegir evento</h1>
<div class="tabla-wrapper">
<table class="table">
    <thead><tr><th>Nombre</th><th>Fecha</th><th>Estado</th><th></th></tr></thead>
    <tbody>
        {% for evento in eventos %}
        <tr>
            <td>{{ evento.nombre }}</td>
            <td>{{ evento.fecha }}</td>
            <td>{{ evento.get_estado_display }}</td>
            <td>
                <a href="{% url 'stock:consumo_evento' evento.pk %}" class="btn-accion btn-editar">Cargar consumo</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="4">No hay eventos cargados todavía.</td></tr>
        {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
