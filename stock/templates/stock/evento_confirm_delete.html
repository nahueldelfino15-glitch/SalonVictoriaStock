{% extends base_template|default:'stock/base.html' %}
{% block content %}

<div class="w-full max-w-lg mx-auto bg-surface-raised border border-surface-overlay rounded-xl p-stack-lg flex flex-col items-center text-center gap-stack-lg">

  <div class="flex flex-col items-center gap-stack-sm">
    <span class="material-symbols-outlined text-error text-[40px]">warning</span>
    <h1 class="font-headline-lg text-headline-lg text-on-surface-high">¿Eliminar el evento?</h1>
    <p class="font-body-md text-body-md text-on-surface-med">
      Vas a eliminar <span class="text-on-surface-high font-semibold">{{ evento.nombre }}</span>
      y todos sus datos asociados (personal y consumo). Esta acción no se puede deshacer.
    </p>
  </div>

  <form method="post" class="w-full flex flex-col sm:flex-row justify-center gap-stack-md pt-stack-md border-t border-surface-variant">
    {% csrf_token %}
    <a {% if es_modal %}data-modal-close{% endif %} href="{% url 'stock:evento_list' %}"
       class="inline-flex items-center justify-center gap-unit luxury-button-secondary font-label-md text-label-md uppercase tracking-wider px-stack-lg py-stack-sm rounded whitespace-nowrap">
      No, cancelar
    </a>
    <button type="submit"
            class="inline-flex items-center justify-center gap-unit bg-transparent border border-error/50 text-error hover:bg-error hover:text-on-error transition-colors font-label-md text-label-md uppercase tracking-wider px-stack-lg py-stack-sm rounded whitespace-nowrap">
      <span class="material-symbols-outlined text-[18px]">delete</span><span>Sí, eliminar</span>
    </button>
  </form>

</div>

{% endblock %}
